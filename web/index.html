<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Mobile viewport fix — prevents zooming and fits screen exactly -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / App appearance -->
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DROP" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>DROP — Music Feed</title>
    <meta name="description" content="DROP — Discover music in a beautiful, immersive feed. Stream chart-topping previews with synced lyrics." />

    <!-- Prevent tap highlight on mobile -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        /* Safe area insets for notch/home bar on modern phones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Lock orientation hint on small screens */
      @media screen and (max-width: 768px) {
        html, body {
          position: fixed;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
      }
    </style>

    <%- process.env.EXPO_PUBLIC_ENTRY_POINT ? '' : '' %>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run DROP.</noscript>
  </body>
</html>
